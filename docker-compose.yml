version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eflow}
      POSTGRES_USER: ${POSTGRES_USER:-eflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eflow} -d ${POSTGRES_DB:-eflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: eflow-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    profiles:
      - mqtt
    restart: unless-stopped

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:

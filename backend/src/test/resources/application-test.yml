spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eflow}
    username: ${POSTGRES_USER:eflow}
    password: ${POSTGRES_PASSWORD:changeme}
